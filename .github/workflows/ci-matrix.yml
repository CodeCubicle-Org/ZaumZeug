# E1-S07 / E1.7 — Cross-platform CI matrix (mock-first; no live API keys)
name: ci-matrix

on:
  push:
  pull_request:

jobs:
  phase1:
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (POSIX wrapper)
        if: runner.os != 'Windows'
        run: |
          chmod +x ./install/client-install.sh
          ./install/client-install.sh --skip-venv --verify

      - name: Install (Windows wrapper)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\install\client-install.ps1 --skip-venv --verify

      - name: Doctor
        run: zaumzeug doctor

      - name: Serve dry-run
        run: zaumzeug serve example --dry-run

      - name: Serve smoke (mock, ephemeral port)
        run: python install/ci_serve_smoke.py example

      - name: OpenAI REST contract (E3-S07)
        run: pytest tests/integration/test_openai_contract.py -v

      - name: Unit + integration suite
        run: pytest tests/unit tests/integration tests/usr-harnesses -v
