# E1-S07 / E1.7 — Cross-platform CI matrix (mock-first; no live API keys)
name: ci-matrix

on:
  push:
  pull_request:

jobs:
  phase1:
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (POSIX wrapper)
        if: runner.os != 'Windows'
        run: |
          chmod +x ./install/client-install.sh
          ./install/client-install.sh --skip-venv --verify

      - name: Install (Windows wrapper)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\install\client-install.ps1 --skip-venv --verify

      - name: Doctor
        run: python -m zaumzeug doctor

      - name: Serve dry-run
        run: python -m zaumzeug serve example --dry-run

      - name: Serve smoke (mock, ephemeral port)
        run: python install/ci_serve_smoke.py example

      - name: OpenAI REST contract (E3-S07)
        run: python -m pytest tests/integration/test_openai_contract.py -v

      - name: Unit + integration suite
        run: python -m pytest tests/unit tests/integration tests/usr-harnesses -v

      # E5-S08 / E5.8 — Phase 2+ Linux-required: deploy → serve --deploy smoke.
      # Windows/macOS production serve is best-effort and not CI-gated in v1.
      - name: Deploy → serve --deploy smoke (E5-S08, Linux)
        if: runner.os == 'Linux'
        run: |
          python -m zaumzeug deploy example
          python install/ci_serve_smoke.py example --deploy

      # E5-S07 / E5.7 — optional deploy bundle as workflow artifact (not enabled by default).
      # Teams that want an audited shippable tree without committing deploy/<name>/ may
      # uncomment the steps below (or add an equivalent job) after `zaumzeug deploy`:
      #
      # - name: Upload deploy bundle
      #   if: runner.os == 'Linux'
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: deploy-example
      #     path: deploy/example/
